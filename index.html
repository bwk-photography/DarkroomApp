<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>F-Stop Darkroom Tool</title>

<link rel="stylesheet" href="css/ui-core.css">
<link rel="stylesheet" href="css/styles.css">
</head>

<body>


<header class="ui-appbar">

  <div class="ui-appbar-left">

    <!-- MOBILE MENU BUTTON -->
    <button id="menuToggle" class="ui-btn ui-menu-btn">
      ☰
    </button>

    <h1 class="ui-appbar-title">BWK Darkroom Tools</h1>

    <!-- DESKTOP NAV -->
    <nav class="ui-nav">
      <button id="showCalcBtn" class="ui-btn active">F‑Stop Calculator</button>
      <button id="showLogBtn" class="ui-btn">Print Log</button>

      <div class="ui-dropdown">
        <button id="printSessionBtn" class="ui-btn ui-dropdown-btn">
          Print Session ▾
        </button>

        <div id="PrintSessionDiv" class="ui-dropdown-menu">
          <a href="#newSession">New Session</a>
          <a href="#activeSession">Active Session</a>
        </div>
      </div>
    </nav>

  </div>

  <div class="ui-appbar-right">
    <button id="loginBtn" class="ui-btn">Sign in with Google</button>
    <button id="logoutBtn" class="ui-btn" style="display:none;">Sign out</button>
    <span id="userInfo" class="ui-userinfo"></span>
  </div>

</header>

<!-- MOBILE NAV (separate) -->
<nav id="mobileNav" class="ui-mobile-nav">
  <button id="showCalcBtn_m" class="ui-btn">F‑Stop Calculator</button>
  <button id="showLogBtn_m" class="ui-btn">Print Log</button>

  <div class="ui-dropdown">
    <button id="printSessionBtn_m" class="ui-btn ui-dropdown-btn">
      Print Session ▾
    </button>

    <div id="PrintSessionDiv_m" class="ui-dropdown-menu">
      <a href="#newSession">New Session</a>
      <a href="#activeSession">Active Session</a>
    </div>
  </div>
</nav>




<!-- ========== F-STOP CALCULATOR SECTION BEGIN ========== -->

<section id="calcView">
    <!-- F‑Stop calculator -->

    <h2>F-Stop Darkroom Printing Tool</h2>


    <!-- ========== CONTROLS BEGIN ========== -->

    <div class="control">
        <label>Base Time (seconds)</label>
        <input type="number" id="baseTime" value="10">
    </div>

    <div class="control">
        <label>F-Stop Increment</label>
        <select id="increment">
            <option value="0.1">0.1</option>
            <option value="0.2">0.2</option>
            <option value="0.3" selected>0.3</option>
            <option value="0.5">0.5</option>
            <option value="1">1</option>
        </select>
    </div>

    <div class="control">
        <label>Steps</label>
        <select id="steps">
            <option>3</option>
            <option selected>5</option>
            <option>7</option>
            <option>9</option>
            <option>11</option>
        </select>
    </div>

    <!-- I want to have a toggle between "Cards" and "Table" with "Table" being defaulted on both phones and desktop -->
    <div class="control" id="viewMode">
        <label>Display Mode</label>
        <div class="toggle">
            <button id="cardBtn">Cards</button>
            <button id="tableBtn" class="active">Table</button>
        </div>
    </div>

    <!-- ========== CONTROLS END ========== -->


    <!-- CARD VIEW -->
    <div id="panel"></div>


    <!-- TABLE VIEW -->
    <div class="table-container" id="tableContainer">
        <table>
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>


    <!-- ========== ACTIONS BEGIN ========== -->

    <div class="actions">
        <!-- create the "Export to PDF" button -->
        <button id="exportBtn">Export PDF</button>
    </div>

    <!-- ========== ACTIONS END ========== -->    


</section>

<!-- ========== F-STOP CALCULATOR SECTION END ========== -->


<!-- ========== PRINT LOG SECTION BEGIN ========== -->
<section id="logView" style="display:none;">
    <!-- Print Log -->

    <section id="printLog">
        <h2>Darkroom Print Log</h2>
        <div class="control">
            <label>Negative / Print Name</label>
            <input id="logTitle" type="text" placeholder="e.g. HP5+_Portrait_01">
        </div>
        <div class="control">
            <label>Paper / Filter / Notes</label>
            <textarea id="logNotes" placeholder="Ilford MGIV, filter 2.5, 16 s base, dodged highlights..."></textarea>
        </div>
        <div class="control">
            <label>Paper Type</label>
            <input id="paperType" type="text" placeholder="Ilford MG RC, Fiber, etc.">
        </div>
            <div class="control">
            <label>Negative Reference</label>
            <input id="filmRef" type="text" placeholder="HP5+ Roll #3 Frame 12">
        </div>
        <div class="control">
            <label>Attach Photo</label>
            <input type="file" id="logPhoto" accept="image/*">
            <img id="photoPreview" style="max-width:200px; margin-top:10px; display:none;">
        </div>
        <button id="saveLogBtn">Save Entry</button>
        <h3>Saved Prints</h3>
        <ul id="logList"></ul>
    </section>

</section>

<!-- ========== PRINT LOG SECTION END ========== -->


<!-- MAIN APP ENTRY -->
<!-- ... body content above ... -->

<script>
document.addEventListener("DOMContentLoaded", () => {

    const btn = document.getElementById("printSessionBtn");
    const menu = document.getElementById("PrintSessionDiv");

    btn.addEventListener("click", (e) => {
        e.stopPropagation();
        menu.classList.toggle("show");
    });

    // Close dropdown when clicking outside
    document.addEventListener("click", () => {
        menu.classList.remove("show");
    });
});
</script>


<script>
document.addEventListener("DOMContentLoaded", () => {

    /* MOBILE MENU TOGGLE */
    const menuBtn = document.getElementById("menuToggle");
    const mobileNav = document.getElementById("mobileNav");

    menuBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        mobileNav.style.display =
            mobileNav.style.display === "flex" ? "none" : "flex";
    });

    document.addEventListener("click", () => {
        mobileNav.style.display = "none";
    });

    /* MOBILE DROPDOWN */
    const btn_m = document.getElementById("printSessionBtn_m");
    const menu_m = document.getElementById("PrintSessionDiv_m");

    btn_m.addEventListener("click", (e) => {
        e.stopPropagation();
        menu_m.classList.toggle("show");
    });

});
</script>

</body>
</html>
